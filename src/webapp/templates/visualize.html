{% extends "base.html" %}
{% block content %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

<div class="page-head">
  <div>
    <h1>进度看板</h1>
    <div class="muted">任务 {{ job.job_id }} · 甘特图、资源联动、基准对比、里程碑和调整历史</div>
  </div>
  <div class="actions">
    <a class="button secondary" href="/jobs/{{ job.job_id }}">返回任务</a>
    <a class="button secondary" href="/jobs/{{ job.job_id }}/edit">编辑排程</a>
    <a class="button secondary" href="/jobs/{{ job.job_id }}/download/visual_data">导出完整 JSON</a>
  </div>
</div>

<section class="viz-toolbar">
  <label>分部工程
    <select id="phaseFilter">
      <option value="">全部</option>
    </select>
  </label>
  <label>施工段
    <select id="sectionFilter">
      <option value="">全部</option>
    </select>
  </label>
  <label>资源
    <select id="resourceFilter">
      <option value="">全部</option>
    </select>
  </label>
  <label>视图
    <select id="viewMode">
      <option value="current">当前计划</option>
      <option value="baseline">基准计划</option>
    </select>
  </label>
  <label class="checkline">
    <input id="criticalOnly" type="checkbox">
    仅关键线路
  </label>
  <button type="button" id="exportImageBtn" class="secondary">导出当前图表图片</button>
  <button type="button" id="exportCsvBtn" class="secondary">导出当前工序 CSV</button>
  <button type="button" id="importCurrentBtn" class="secondary">导入看板 JSON</button>
  <button type="button" id="importBaselineBtn" class="secondary">导入基准 JSON</button>
  <input id="importCurrentFile" type="file" accept=".json,application/json" hidden>
  <input id="importBaselineFile" type="file" accept=".json,application/json" hidden>
</section>

<div id="vizNotice" class="notice" hidden></div>

<section class="viz-metrics" id="metrics"></section>

<section class="viz-layout">
  <div class="viz-panel viz-main-panel">
    <div class="panel-head">
      <h2>交互式甘特图</h2>
      <span class="muted" id="sourceLabel">读取中...</span>
    </div>
    <div id="ganttChart" class="viz-chart gantt-chart"></div>
  </div>
  <aside class="viz-panel task-panel">
    <h2>工序详情</h2>
    <div id="taskDetail" class="task-detail muted">点击甘特图中的工序查看资源配置。</div>
  </aside>
</section>

<section class="viz-panel">
  <div class="panel-head">
    <h2>资源联动</h2>
    <span class="muted" id="resourceHint">按筛选或所选工序显示资源需求与能力。</span>
  </div>
  <div id="resourceChart" class="viz-chart resource-chart"></div>
</section>

<section class="viz-grid">
  <div class="viz-panel">
    <h2>基准 / 调整对比</h2>
    <div class="table-wrap compact-table">
      <table>
        <thead>
          <tr>
            <th>工序</th>
            <th>当前完成</th>
            <th>基准完成</th>
            <th>偏差</th>
            <th>关键</th>
          </tr>
        </thead>
        <tbody id="comparisonRows"></tbody>
      </table>
    </div>
  </div>
  <div class="viz-panel">
    <h2>关键节点</h2>
    <div id="milestoneList" class="milestone-list muted">暂无里程碑数据。</div>
  </div>
</section>

<section class="viz-panel">
  <h2>调整历史</h2>
  <div id="historyList" class="history-list muted">暂无调整记录。</div>
</section>

<script>
(() => {
  const jobId = "{{ job.job_id }}";
  const ganttEl = document.getElementById("ganttChart");
  const resourceEl = document.getElementById("resourceChart");
  const ganttChart = echarts.init(ganttEl);
  const resourceChart = echarts.init(resourceEl);
  const dayMs = 24 * 60 * 60 * 1000;
  let payload = null;
  let selectedTaskId = "";
  let filteredTasks = [];

  const controls = {
    phase: document.getElementById("phaseFilter"),
    section: document.getElementById("sectionFilter"),
    resource: document.getElementById("resourceFilter"),
    viewMode: document.getElementById("viewMode"),
    criticalOnly: document.getElementById("criticalOnly"),
  };

  fetch(`/jobs/${jobId}/visualize/data`)
    .then(response => {
      if (!response.ok) throw new Error("读取看板数据失败");
      return response.json();
    })
    .then(data => {
      payload = normalizePayload(data);
      renderAll("当前任务数据");
    })
    .catch(error => showNotice(error.message || String(error), true));

  Object.values(controls).forEach(control => {
    control.addEventListener("change", () => {
      selectedTaskId = "";
      renderAll();
    });
  });

  document.getElementById("exportImageBtn").addEventListener("click", () => {
    const link = document.createElement("a");
    link.download = `schedule-gantt-${jobId}.png`;
    link.href = ganttChart.getDataURL({ pixelRatio: 2, backgroundColor: "#ffffff" });
    link.click();
  });

  document.getElementById("exportCsvBtn").addEventListener("click", () => {
    const rows = [
      ["task_id", "task_name", "phase", "section", "planned_start", "planned_finish", "duration_days", "total_float", "is_critical"],
      ...filteredTasks.map(task => [
        task.task_id,
        task.task_name,
        task.phase,
        task.section,
        task.planned_start,
        task.planned_finish,
        task.duration_days ?? "",
        task.total_float ?? "",
        task.is_critical ? "true" : "false",
      ]),
    ];
    downloadText(`schedule-view-${jobId}.csv`, "\ufeff" + rows.map(row => row.map(csvCell).join(",")).join("\n"), "text/csv;charset=utf-8");
  });

  document.getElementById("importCurrentBtn").addEventListener("click", () => {
    document.getElementById("importCurrentFile").click();
  });
  document.getElementById("importBaselineBtn").addEventListener("click", () => {
    document.getElementById("importBaselineFile").click();
  });
  document.getElementById("importCurrentFile").addEventListener("change", event => importJson(event, "current"));
  document.getElementById("importBaselineFile").addEventListener("change", event => importJson(event, "baseline"));

  ganttChart.on("click", params => {
    if (!params.data || !params.data.task_id) return;
    selectedTaskId = params.data.task_id;
    renderTaskDetail();
    renderResourceChart();
  });

  window.addEventListener("resize", () => {
    ganttChart.resize();
    resourceChart.resize();
  });

  function renderAll(sourceText) {
    if (!payload) return;
    fillFilters();
    renderMetrics();
    renderGantt();
    renderResourceChart();
    renderTaskDetail();
    renderComparison();
    renderMilestones();
    renderHistory();
    if (sourceText) {
      document.getElementById("sourceLabel").textContent = sourceText;
    }
  }

  function activeTasks() {
    const baselineTasks = payload.baseline && Array.isArray(payload.baseline.tasks) ? payload.baseline.tasks : [];
    if (controls.viewMode.value === "baseline" && baselineTasks.length) {
      return baselineTasks;
    }
    return payload.tasks || [];
  }

  function fillFilters() {
    fillSelect(controls.phase, unique(activeTasks().map(task => task.phase).filter(Boolean)));
    fillSelect(controls.section, unique(activeTasks().map(task => task.section).filter(Boolean)));
    fillSelect(controls.resource, unique((payload.resources || []).map(item => item.resource_name).filter(Boolean)));
    const hasBaseline = !!(payload.baseline && Array.isArray(payload.baseline.tasks) && payload.baseline.tasks.length);
    controls.viewMode.querySelector('option[value="baseline"]').disabled = !hasBaseline;
  }

  function renderMetrics() {
    const tasks = activeTasks();
    const current = filterTasks(tasks);
    const critical = current.filter(task => task.is_critical).length;
    const startTimes = current.map(task => parseDate(task.planned_start)).filter(Boolean);
    const finishTimes = current.map(task => parseDate(task.planned_finish)).filter(Boolean);
    const start = startTimes.length ? formatDate(new Date(Math.min(...startTimes))) : "-";
    const finish = finishTimes.length ? formatDate(new Date(Math.max(...finishTimes))) : "-";
    const duration = startTimes.length && finishTimes.length
      ? Math.round((Math.max(...finishTimes) - Math.min(...startTimes)) / dayMs) + 1
      : "-";
    document.getElementById("metrics").innerHTML = [
      metricCard("工序数量", current.length),
      metricCard("关键工序", critical),
      metricCard("计划开始", start),
      metricCard("计划完成", finish),
      metricCard("总跨度", duration === "-" ? "-" : `${duration} 天`),
    ].join("");
  }

  function renderGantt() {
    filteredTasks = filterTasks(activeTasks()).filter(task => parseDate(task.planned_start) && parseDate(task.planned_finish));
    filteredTasks.sort((a, b) => parseDate(a.planned_start) - parseDate(b.planned_start));
    const names = filteredTasks.map(task => shortName(task.task_name || task.task_id, 24));
    if (!filteredTasks.length) {
      ganttChart.clear();
      const sourceTasks = activeTasks();
      showNotice(sourceTasks.length ? "当前筛选条件下没有可展示的工序。" : "当前任务尚未生成进度数据。请先运行任务或导入看板 JSON。", false);
      return;
    }
    const rowHeight = Math.max(18, Math.min(34, 520 / Math.max(filteredTasks.length, 1)));
    ganttEl.style.height = `${Math.max(460, filteredTasks.length * rowHeight + 120)}px`;
    ganttChart.resize();
    ganttChart.setOption({
      animation: false,
      grid: { left: 190, right: 32, top: 36, bottom: 72 },
      tooltip: {
        formatter: params => {
          const task = params.data.raw;
          return `<strong>${escapeHtml(task.task_name || task.task_id)}</strong><br>` +
            `编号：${escapeHtml(task.task_id)}<br>` +
            `时间：${escapeHtml(task.planned_start)} 至 ${escapeHtml(task.planned_finish)}<br>` +
            `工期：${task.duration_days ?? "-"} 天<br>` +
            `总时差：${task.total_float ?? "-"}<br>` +
            `关键线路：${task.is_critical ? "是" : "否"}`;
        }
      },
      dataZoom: [
        { type: "slider", xAxisIndex: 0, height: 22, bottom: 28 },
        { type: "inside", xAxisIndex: 0 },
        { type: "inside", yAxisIndex: 0 },
      ],
      xAxis: { type: "time", axisLabel: { color: "#556070" }, splitLine: { show: true, lineStyle: { color: "#edf0f4" } } },
      yAxis: { type: "category", data: names, inverse: true, axisLabel: { color: "#364152" } },
      series: [{
        type: "custom",
        name: "工序",
        renderItem: renderGanttItem,
        encode: { x: [1, 2], y: 0 },
        data: filteredTasks.map((task, index) => ({
          value: [index, parseDate(task.planned_start), parseDate(task.planned_finish)],
          raw: task,
          task_id: task.task_id,
          itemStyle: { color: task.is_critical ? "#d1495b" : "#2f80ed" },
        })),
      }],
    }, true);
  }

  function renderGanttItem(params, api) {
    const categoryIndex = api.value(0);
    const start = api.coord([api.value(1), categoryIndex]);
    const end = api.coord([api.value(2), categoryIndex]);
    const height = Math.max(8, api.size([0, 1])[1] * 0.56);
    const rect = echarts.graphic.clipRectByRect(
      { x: start[0], y: start[1] - height / 2, width: Math.max(end[0] - start[0], 4), height },
      { x: params.coordSys.x, y: params.coordSys.y, width: params.coordSys.width, height: params.coordSys.height }
    );
    return rect && {
      type: "rect",
      shape: rect,
      style: api.style({ radius: 3 }),
    };
  }

  function renderResourceChart() {
    if (!payload) return;
    const task = filteredTasks.find(item => item.task_id === selectedTaskId);
    if (task && task.resources && task.resources.length) {
      const names = task.resources.map(item => item.resource_name || item.resource_type || "资源");
      resourceChart.setOption({
        tooltip: { trigger: "axis" },
        legend: { data: ["需求", "能力"] },
        grid: { left: 52, right: 28, top: 48, bottom: 68 },
        xAxis: { type: "category", data: names, axisLabel: { interval: 0, rotate: names.length > 6 ? 25 : 0 } },
        yAxis: { type: "value" },
        series: [
          { name: "需求", type: "bar", data: task.resources.map(item => item.demand || 0), itemStyle: { color: "#2f80ed" } },
          { name: "能力", type: "bar", data: task.resources.map(item => item.capacity || 0), itemStyle: { color: "#32a852" } },
        ],
      }, true);
      document.getElementById("resourceHint").textContent = `当前显示：${task.task_name || task.task_id} 的资源配置`;
      return;
    }

    const selectedResource = controls.resource.value;
    const loadRows = (payload.resource_load || []).filter(row => !selectedResource || row.resource_name === selectedResource);
    if (selectedResource && loadRows.length) {
      resourceChart.setOption({
        tooltip: { trigger: "axis" },
        legend: { data: ["需求", "能力"] },
        grid: { left: 52, right: 28, top: 48, bottom: 68 },
        xAxis: { type: "category", data: loadRows.map(row => row.date_or_period), axisLabel: { rotate: loadRows.length > 8 ? 25 : 0 } },
        yAxis: { type: "value" },
        series: [
          { name: "需求", type: "line", smooth: true, data: loadRows.map(row => row.demand || 0), itemStyle: { color: "#2f80ed" } },
          { name: "能力", type: "line", smooth: true, data: loadRows.map(row => row.capacity || 0), itemStyle: { color: "#32a852" } },
        ],
      }, true);
      document.getElementById("resourceHint").textContent = `当前显示：${selectedResource} 的资源负荷`;
      return;
    }

    const aggregate = new Map();
    for (const row of payload.resources || []) {
      const name = row.resource_name || row.resource_type || "资源";
      const item = aggregate.get(name) || { demand: 0, capacity: 0 };
      item.demand += Number(row.demand || 0);
      item.capacity += Number(row.capacity || 0);
      aggregate.set(name, item);
    }
    const items = Array.from(aggregate.entries()).sort((a, b) => b[1].demand - a[1].demand).slice(0, 15);
    resourceChart.setOption({
      tooltip: { trigger: "axis" },
      legend: { data: ["需求", "能力"] },
      grid: { left: 52, right: 28, top: 48, bottom: 78 },
      xAxis: { type: "category", data: items.map(item => item[0]), axisLabel: { interval: 0, rotate: items.length > 6 ? 30 : 0 } },
      yAxis: { type: "value" },
      series: [
        { name: "需求", type: "bar", data: items.map(item => item[1].demand), itemStyle: { color: "#2f80ed" } },
        { name: "能力", type: "bar", data: items.map(item => item[1].capacity), itemStyle: { color: "#32a852" } },
      ],
    }, true);
    document.getElementById("resourceHint").textContent = "当前显示：资源需求汇总 Top 15";
  }

  function renderTaskDetail() {
    const task = filteredTasks.find(item => item.task_id === selectedTaskId);
    const box = document.getElementById("taskDetail");
    if (!task) {
      box.className = "task-detail muted";
      box.textContent = filteredTasks.length ? "点击甘特图中的工序查看资源配置。" : "暂无可选工序。";
      return;
    }
    box.className = "task-detail";
    const resources = task.resources && task.resources.length
      ? task.resources.map(item => `<li>${escapeHtml(item.resource_name || item.resource_type)}：需求 ${item.demand ?? "-"}${escapeHtml(item.unit || "")}，能力 ${item.capacity ?? "-"}</li>`).join("")
      : "<li>未记录资源配置</li>";
    box.innerHTML = `
      <strong>${escapeHtml(task.task_name || task.task_id)}</strong>
      <dl>
        <dt>编号</dt><dd>${escapeHtml(task.task_id)}</dd>
        <dt>分部</dt><dd>${escapeHtml(task.phase || "-")}</dd>
        <dt>施工段</dt><dd>${escapeHtml(task.section || "-")}</dd>
        <dt>时间</dt><dd>${escapeHtml(task.planned_start)} 至 ${escapeHtml(task.planned_finish)}</dd>
        <dt>工期</dt><dd>${task.duration_days ?? "-"} 天</dd>
        <dt>总时差</dt><dd>${task.total_float ?? "-"}</dd>
        <dt>关键线路</dt><dd>${task.is_critical ? "是" : "否"}</dd>
      </dl>
      <h3>资源</h3>
      <ul>${resources}</ul>
    `;
  }

  function renderComparison() {
    const body = document.getElementById("comparisonRows");
    const baselineTasks = payload.baseline && Array.isArray(payload.baseline.tasks) ? payload.baseline.tasks : [];
    if (!baselineTasks.length) {
      body.innerHTML = '<tr><td colspan="5" class="muted">暂无基准计划。可导入基准 JSON，或在首次计算完成后以首次结果作为基准。</td></tr>';
      return;
    }
    const baselineById = new Map(baselineTasks.map(task => [task.task_id, task]));
    const rows = filterTasks(payload.tasks || []).map(task => {
      const base = baselineById.get(task.task_id);
      const delta = base ? dateDiff(task.planned_finish, base.planned_finish) : null;
      return { task, base, delta };
    }).filter(item => item.base && item.delta !== 0);
    rows.sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
    const shown = rows.slice(0, 50);
    if (!shown.length) {
      body.innerHTML = '<tr><td colspan="5" class="muted">当前筛选下未发现与基准计划的日期偏差。</td></tr>';
      return;
    }
    body.innerHTML = shown.map(item => `
      <tr>
        <td>${escapeHtml(item.task.task_name || item.task.task_id)}</td>
        <td>${escapeHtml(item.task.planned_finish || "-")}</td>
        <td>${escapeHtml(item.base.planned_finish || "-")}</td>
        <td><span class="${item.delta > 0 ? "bad-text" : "good-text"}">${item.delta > 0 ? "+" : ""}${item.delta} 天</span></td>
        <td>${item.task.is_critical ? "是" : "否"}</td>
      </tr>
    `).join("");
  }

  function renderMilestones() {
    const box = document.getElementById("milestoneList");
    const rows = payload.milestones || [];
    if (!rows.length) {
      box.className = "milestone-list muted";
      box.textContent = "暂无里程碑数据。";
      return;
    }
    box.className = "milestone-list";
    box.innerHTML = rows.map(row => `
      <div class="milestone-item">
        <strong>${escapeHtml(row.milestone_name || row.milestone_id)}</strong>
        <span class="${isPass(row.result) ? "status-pill ok" : "status-pill warn"}">${escapeHtml(row.result || "-")}</span>
        <p>目标：${escapeHtml(row.target_date || "-")} · 实际：${escapeHtml(row.actual_date || "-")}</p>
        ${row.suggestion ? `<p class="muted">${escapeHtml(row.suggestion)}</p>` : ""}
      </div>
    `).join("");
  }

  function renderHistory() {
    const box = document.getElementById("historyList");
    const rows = payload.adjustment_history || [];
    if (!rows.length) {
      box.className = "history-list muted";
      box.textContent = "暂无调整记录。";
      return;
    }
    box.className = "history-list";
    box.innerHTML = rows.map(row => `
      <article class="history-item">
        <div>
          <strong>${escapeHtml(row.event_type || row.event_id)}</strong>
          <span class="muted">${escapeHtml(dateOnly(row.created_at || ""))}</span>
        </div>
        <p>影响对象：${escapeHtml(row.related_task || "全部/未指定")} · 影响：${row.impact_days ?? "-"} 天 · 优先级：${escapeHtml(row.priority || "-")}</p>
        ${row.note ? `<p>${escapeHtml(row.note)}</p>` : ""}
        ${(row.plans || []).map(plan => `<p class="history-measure">措施：${escapeHtml(plan.measure || "-")} ${plan.score ? `· 评分 ${plan.score}` : ""}</p>`).join("")}
      </article>
    `).join("");
  }

  function filterTasks(tasks) {
    return (tasks || []).filter(task => {
      if (controls.phase.value && task.phase !== controls.phase.value) return false;
      if (controls.section.value && task.section !== controls.section.value) return false;
      if (controls.criticalOnly.checked && !task.is_critical) return false;
      if (controls.resource.value) {
        return (task.resources || []).some(item => item.resource_name === controls.resource.value);
      }
      return true;
    });
  }

  function importJson(event, target) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = normalizePayload(JSON.parse(reader.result));
        if (target === "baseline") {
          payload.baseline = { tasks: imported.tasks || [] };
          controls.viewMode.value = "current";
          showNotice("已导入基准 JSON，可在对比表查看偏差。", false);
        } else {
          payload = imported;
          showNotice("已导入看板 JSON，当前页面正在预览外部数据。", false);
        }
        selectedTaskId = "";
        renderAll(target === "baseline" ? "当前任务数据 + 外部基准" : "外部 JSON 预览");
      } catch (error) {
        showNotice(`JSON 解析失败：${error.message || error}`, true);
      } finally {
        event.target.value = "";
      }
    };
    reader.readAsText(file, "utf-8");
  }

  function normalizePayload(data) {
    if (Array.isArray(data)) {
      return { tasks: data.map(normalizeTask), resources: [], resource_load: [], milestones: [], adjustment_history: [], baseline: {} };
    }
    const baseline = data.baseline || {};
    return {
      ...data,
      tasks: (data.tasks || []).map(normalizeTask),
      resources: data.resources || [],
      resource_load: data.resource_load || [],
      milestones: data.milestones || [],
      adjustment_history: data.adjustment_history || [],
      baseline: {
        ...baseline,
        tasks: Array.isArray(baseline.tasks) ? baseline.tasks.map(normalizeTask) : [],
      },
    };
  }

  function normalizeTask(task) {
    return {
      task_id: String(task.task_id || ""),
      task_name: String(task.task_name || task.name || task.task_id || ""),
      phase: String(task.phase || "未分组"),
      section: String(task.section || "未分区"),
      planned_start: String(task.planned_start || task.start || ""),
      planned_finish: String(task.planned_finish || task.finish || ""),
      duration_days: task.duration_days ?? null,
      total_float: task.total_float ?? null,
      is_critical: task.is_critical === true || task.is_critical === "true" || task.is_critical === 1,
      resources: Array.isArray(task.resources) ? task.resources : [],
    };
  }

  function fillSelect(select, values) {
    const current = select.value;
    select.innerHTML = '<option value="">全部</option>' + values.map(value => `<option value="${escapeAttr(value)}">${escapeHtml(value)}</option>`).join("");
    if (values.includes(current)) select.value = current;
  }

  function metricCard(label, value) {
    return `<div><span>${escapeHtml(label)}</span><strong>${escapeHtml(String(value))}</strong></div>`;
  }

  function showNotice(message, isError) {
    const box = document.getElementById("vizNotice");
    box.hidden = false;
    box.className = isError ? "alert" : "notice";
    box.textContent = message;
    if (!isError) setTimeout(() => { box.hidden = true; }, 3500);
  }

  function parseDate(value) {
    if (!value) return null;
    const time = Date.parse(String(value).replace(/\./g, "-").replace(/\//g, "-"));
    return Number.isFinite(time) ? time : null;
  }

  function dateDiff(current, baseline) {
    const a = parseDate(current);
    const b = parseDate(baseline);
    if (!a || !b) return null;
    return Math.round((a - b) / dayMs);
  }

  function formatDate(date) {
    return date.toISOString().slice(0, 10);
  }

  function dateOnly(value) {
    const text = String(value || "");
    const normalized = text.replace("T", " ");
    return normalized.length >= 19 ? normalized.slice(0, 19) : normalized;
  }

  function unique(values) {
    return Array.from(new Set(values)).sort();
  }

  function shortName(value, length) {
    return value.length > length ? `${value.slice(0, length - 1)}...` : value;
  }

  function isPass(value) {
    return /通过|pass|准时|完成/.test(String(value || "").toLowerCase());
  }

  function csvCell(value) {
    const text = String(value ?? "");
    return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
  }

  function downloadText(filename, text, type) {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([text], { type }));
    link.download = filename;
    link.click();
    URL.revokeObjectURL(link.href);
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    }[char]));
  }

  function escapeAttr(value) {
    return escapeHtml(value).replace(/"/g, "&quot;");
  }
})();
</script>
{% endblock %}
